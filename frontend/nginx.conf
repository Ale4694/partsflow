server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The backend accepts files up to 5 MB; leave room for the multipart overhead
    client_max_body_size 6m;

    # The browser only talks to this server; /api is forwarded to the Spring Boot
    # container ("app" is its service name in compose.yaml). Same origin = no CORS.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM calls can take several seconds
        proxy_read_timeout 120s;
    }

    # Single-page app: any other path is a client-side route, so serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
