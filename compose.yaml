services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partsflow}
      POSTGRES_USER: ${POSTGRES_USER:-partsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partsflow}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-partsflow}
      DB_USER: ${POSTGRES_USER:-partsflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-partsflow}
      # Passed through from your shell or .env. Empty = the AI endpoints answer 503, everything else works.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash}
    healthcheck:
      # The image has curl. "UP" only after Flyway ran and the database answers.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      # nginx starts only when the app can answer, otherwise the first requests would get 502
      app:
        condition: service_healthy
    ports:
      # The web interface. Change the host port with WEB_PORT if 8081 is taken.
      - "${WEB_PORT:-8081}:8080"

volumes:
  db-data:
