spring:
  ai:
    model:
      # Which Spring AI chat model starts (both starters are on the classpath, exactly one may run).
      # The nested placeholder maps LLM_PROVIDER (gemini | openai-compatible) onto Spring AI's names below.
      chat: ${partsflow.ai.chat-model.${partsflow.ai.provider}:none}
    google:
      genai:
        # The key is read ONLY from the environment. Empty = AI endpoints answer 503, the rest of the app works.
        api-key: ${partsflow.ai.api-key}
        chat:
          # Flash-class model that is free of charge on the Gemini Developer API (check the pricing page for changes)
          model: ${LLM_MODEL:gemini-3.5-flash}
    openai:
      # Used when LLM_PROVIDER=openai-compatible: OpenAI, Mistral, Groq, DeepSeek, OpenRouter...
      api-key: ${partsflow.ai.api-key}
      base-url: ${partsflow.ai.base-url}
      # The SDK retries on its own; only LlmGateway should retry (see OpenAiCompatibleConfiguration)
      max-retries: 0
      chat:
        model: ${partsflow.ai.model}
  autoconfigure:
    exclude:
      # Spring AI would build its own Gemini connection for embeddings (needing a Vertex project id, with the
      # SDK's default retries). GeminiConfiguration supplies the connection details from our own client instead.
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
  application:
    name: partsflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partsflow}
    username: ${DB_USER:partsflow}
    password: ${DB_PASSWORD:partsflow}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    placeholders:
      # Size of the embedding vectors, used by V6__item_embedding.sql (see ADR 0012)
      embeddingDimensions: ${partsflow.embeddings.dimensions}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is exposed (used by the Docker healthcheck): no env, beans, metrics...
        include: health

partsflow:
  embeddings:
    # Semantic search (embeddings). Same provider and key as the chat model; see README, "Semantic search".
    model: ${LLM_EMBEDDING_MODEL:}
    dimensions: ${LLM_EMBEDDING_DIMENSIONS:768}
  ai:
    # LLM settings, only from environment variables (see README, "Choosing the LLM provider")
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:}
    model: ${LLM_MODEL:}
    chat-model:
      gemini: google-genai
      openai-compatible: openai
    # Embedding model names for each provider: the OpenAI starter reads spring.ai.model.embedding, the Gemini one
    # spring.ai.model.embedding.text (see the end of this file)
    embedding-model:
      openai:
        openai-compatible: openai
      gemini:
        gemini: google-genai
    max-agent-steps: 5
    retry:
      max-attempts: 3
      initial-backoff: 2s
      # A 429 asking for a longer wait (a daily quota asks for hours) fails at once instead of being retried
      max-suggested-delay: 20s

# Which Spring AI embedding model starts (like the chat model above, one of the two). These are dotted keys at the
# root on purpose: "spring.ai.model.embedding" and "spring.ai.model.embedding.text" cannot both be nested YAML maps.
spring.ai.model.embedding: ${partsflow.ai.embedding-model.openai.${partsflow.ai.provider}:none}
spring.ai.model.embedding.text: ${partsflow.ai.embedding-model.gemini.${partsflow.ai.provider}:none}
