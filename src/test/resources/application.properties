# Defaults for every test (explicit @TestPropertySource values win).
# No test may use a real key, even when LLM_API_KEY is exported in the shell: tests that need the AI set their own.
partsflow.ai.api-key=
# No background threads or timers in tests: indexing runs in the calling thread when an item is saved
partsflow.embeddings.indexing.scheduled=false
partsflow.embeddings.indexing.async=false
